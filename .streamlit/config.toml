[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#F3EEE3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111111"
font = "sans serif"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

